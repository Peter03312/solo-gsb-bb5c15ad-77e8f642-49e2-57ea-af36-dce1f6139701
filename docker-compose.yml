services:
  app:
    build: .
    image: rehearsal-srt:latest
    container_name: rehearsal-srt
    ports:
      # 宿主机端口:容器端口；可用环境变量 APP_PORT 覆盖宿主机端口
      - "${APP_PORT:-3000}:3000"
    environment:
      # 容器内监听端口（与右侧端口映射的容器侧保持一致）
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      # SQLite 数据库持久化到命名卷
      - srt-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/scripts').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  srt-data:
